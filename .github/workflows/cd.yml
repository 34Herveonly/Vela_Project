# CD Pipeline — deploys to GCP on every successful merge to main.
#
# Required GitHub Secrets (set in Settings → Secrets and variables → Actions):
#   GCP_SERVER_IP:        Public IP address of the GCP server
#   GCP_SSH_PRIVATE_KEY:  Private SSH key for GCP server access
#                         (the matching public key must be in
#                          ~/.ssh/authorized_keys on the GCP server,
#                          under the devops_admin user)
#
# The GCP server must have:
#   - Docker installed and running
#   - /etc/vela/config.toml present with valid configuration
#     (this file is managed by Ansible — see ROADMAP.md v1.0.0 — this
#      pipeline only restarts the container, it never touches the config)
#   - Port 7700 open in GCP firewall rules
#   - The devops_admin user able to run docker commands (in the docker group)
#
# This will fail on first run until the GCP server exists and the two
# secrets above are set — that's expected. CI (ci.yml) works standalone
# and is what every push/PR actually needs to pass.

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for cache-to/cache-from: type=gha below — the default
      # "docker" driver can't export cache at all, only the "docker-container"
      # driver this action sets up can. Without it, the build fails with
      # "Cache export is not supported for the docker driver."
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/34herveonly/vela
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log image digest
        run: echo "Pushed ghcr.io/34herveonly/vela@${{ steps.push.outputs.digest }}"

  deploy:
    name: Deploy to GCP server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H ${{ secrets.GCP_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/gcp_key devops_admin@${{ secrets.GCP_SERVER_IP }} << 'DEPLOY'
            set -e

            echo "=== Pulling latest Vela image ==="
            docker pull ghcr.io/34herveonly/vela:latest

            echo "=== Stopping existing Vela container ==="
            docker stop vela 2>/dev/null || true
            docker rm vela 2>/dev/null || true

            echo "=== Starting new Vela container ==="
            docker run -d \
              --name vela \
              --restart unless-stopped \
              --network host \
              -v /etc/vela/config.toml:/etc/vela/config.toml:ro \
              -v /var/run/docker.sock:/var/run/docker.sock \
              --group-add $(stat -c '%g' /var/run/docker.sock) \
              -v /var/log/vela:/var/log/vela \
              -e RUST_LOG=info \
              ghcr.io/34herveonly/vela:latest

            echo "=== Waiting for Vela to start ==="
            sleep 5

            echo "=== Verifying deployment ==="
            curl -f http://localhost:7700/health
            echo ""
            echo "=== Deployment successful ==="
          DEPLOY

      - name: Verify deployment from outside the server
        run: curl -f http://${{ secrets.GCP_SERVER_IP }}:7700/health

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/gcp_key
