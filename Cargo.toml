[package]
name = "vela"
version = "0.1.0"
edition = "2021"
authors = ["Vela Contributors"]
description = "A single-binary service health orchestrator for lean Linux deployments"
license = "MIT"
repository = "https://github.com/34Herveonly/Vela_Project"
readme = "README.md"
keywords = ["proxy", "health-check", "orchestrator", "devops", "microservices"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "vela"
path = "src/main.rs"

[[bin]]
name = "vela-ctl"
path = "src/bin/vela_ctl/main.rs"

[dependencies]
# Async runtime — standard choice for Rust networking; stdlib has no async executor
tokio = { version = "1", features = ["full"] }

# HTTP client for health checks, outgoing alert webhooks, and (blocking mode)
# the vela-ctl CLI. reqwest is the de-facto standard; stdlib has no HTTP client.
# "blocking" is needed by vela-ctl, a short-lived CLI that has no reason to
# carry an async runtime just to make a handful of sequential HTTP calls.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# clap: CLI argument parsing for vela-ctl. stdlib has no argument parser.
clap = { version = "4", features = ["derive", "color"] }

# colored: terminal color output for vela-ctl's status display.
# stdlib has no terminal color support.
colored = "2"

# HTTP server for the API engine and proxy engine
# axum is the tokio-native server; built on hyper; well-maintained
axum = { version = "0.7", features = ["tokio"] }

# TOML config file parsing — stdlib has no TOML parser
toml = "0.8"

# Struct deserialization from TOML/JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timestamp handling — stdlib time APIs are insufficient for formatting/serialization
chrono = { version = "0.4", features = ["serde"] }

# Async channel for event broadcasting between engines
tokio-stream = "0.1"

# tokio-util: provides CancellationToken for cooperative task shutdown.
# tokio itself does not provide CancellationToken — this crate is the official extension.
tokio-util = { version = "0.7", features = ["rt"] }

# subtle: constant-time byte comparison for API key authentication.
# std equality operators short-circuit and leak timing information.
# This crate provides ConstantTimeEq that compares in fixed time.
subtle = "2"

# bollard: the de-facto Rust Docker API client. Talks to the Docker daemon
# over a Unix socket (Linux), named pipe (Windows), or TCP — the stdlib and
# every other existing dependency have no Docker client capability at all.
# Its image-pull API returns a Stream, consumed via the already-present
# tokio-stream dependency's StreamExt — no separate futures crate needed.
bollard = "0.17"

[dev-dependencies]
# HTTP test server for integration tests
mockito = "1"

# tower: provides ServiceExt::oneshot for axum handler unit testing
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
